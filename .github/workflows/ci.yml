name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck bats
      - name: Shellcheck
        run: shellcheck idle-guard.sh
      - name: Bats
        run: bats tests/
